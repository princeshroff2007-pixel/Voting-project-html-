<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>web creater</title>
  <style>
    /* Basic page styling */
    body {
      background-color: #f4f4f4;
      font-family: Arial, Helvetica, sans-serif;
      padding: 40px;
      margin: 0;
    }

    /* Outer bordered container */
    .container {
      max-width: 800px;
      margin: 0 auto;
      background-color: #ffffff;
      border: 2px solid #222222;
      padding: 30px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    /* Individual person column */
    .card {
      width: 30%;
      text-align: left;
    }

    /* Profile picture box */
    .photo {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border: 1px solid #222222;
      display: block;
      margin-bottom: 10px;
    }

    /* Divider line below photo */
    hr {
      border: 0;
      border-top: 1px solid #222222;
      margin: 10px 0;
    }

    /* Person name heading */
    h3 {
      margin: 8px 0;
      font-size: 16px;
      color: #111111;
      text-align: center;
    }

    /* Numbered social links list */
    ol {
      padding-left: 20px;
      margin: 10px 0;
      line-height: 1.8;
    }

    /* Social media links */
    a {
      color: #0056b3;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Main Outer Box -->
  <div class="container">

    <!-- Person 1 -->
    <div class="card">
      <img
        class="photo"
        src="Images\Officials\Shivam_Kumar.png"
        alt="Shivam_Kumar"
      >
      <hr>
      <h3>Shivam Kumar</h3>
      <h6>(Group leader)</h6>
      <ol>
        <li><a href="https://linkedin.com/in/shivam-kumar-techie" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
        <li><a href="https://github.com/ShivamKumarTechie" target="_blank" rel="noopener noreferrer">GitHub</a></li>
        <li><a href="https://youtube.com/@shivam.kumar.techie" target="_blank" rel="noopener noreferrer">YouTube</a></li>
        <li><a href="https://instagram.com/shivam.kumar.techie" target="_blank" rel="noopener noreferrer">Instagram</a></li>
      </ol>
    </div>

    <!-- Person 2 -->
    <div class="card">
      <img
        class="photo"
        src="Images\Officials\Prince_Kumar.jpeg"
        alt="Prince_Kumar"
      >
      <hr>
      <h3>Prince Kumar</h3>
      <h6>(2nd member)</h6>
      <ol>
        <li><a href="https://www.linkedin.com/in/prince-soni-73978b451/" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
        <li><a href="https://github.com/princeshroff2007-pixel" target="_blank" rel="noopener noreferrer">GitHub</a></li>
        <li><a href="" target="_blank" rel="noopener noreferrer">Instagram</a></li>
      </ol>
    </div>

    <!-- Person 3 -->
    <div class="card">
      <img
        class="photo"
        src="Images\Officials\Mohit_Kumar_Sharma.jpg"
        alt="Mohit_Kumar_Sharma"
      >
      <hr>
      <h3>Mohit kumar Sharma</h3>
      <h6>(3rd member)</h6>
      <ol>
        <li><a href="https://www.linkedin.com/in/mohit-kumar-sharma-b08075445" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
        <li><a href="https://github.com/mohitkumarsharma776194-lgtm" target="_blank" rel="noopener noreferrer">GitHub</a></li>
        <li><a href="https://youtube.com" target="_blank" rel="noopener noreferrer">YouTube</a></li>
      </ol>
    </div>

  </div>

</body>
</html>
